[package]
name = "vipe-desktop"
description = "VIPE desktop app (Tauri 2)"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

# Standalone workspace (see desktop/Cargo.toml).
[workspace]

[lib]
name = "vipe_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
vipe-desktop-core = { path = "../../core" }
tauri = { version = "=2.12.5", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-updater = "=2.14.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
tokio = { version = "=1.54.1", features = ["time"] }

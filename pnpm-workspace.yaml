# pnpm-workspace.yaml
# pnpm v11+ requires buildAllow in this file, not .npmrc or package.json
packages:
  - '.'
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  sharp: true
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  '@swc/core': true
  # Telemetry only; never run its install script.
  '@scarf/scarf': false

# pnpm's supply-chain policy delays very recent releases; these were pinned on
# purpose (see odd/tasks/migracion-backend-nestjs.md, T3).
minimumReleaseAgeExclude:
  - '@nestjs/common@12.3.3'
  - '@nestjs/core@12.3.3'
  - '@nestjs/platform-express@12.3.3'
  - '@nestjs/testing@12.3.3'

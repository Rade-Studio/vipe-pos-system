# ============================================
# VIPE POS - Despliegue en Coolify (sin Caddy, sin MinIO propio, sin puertos publicados)
# ============================================
# El proxy de Coolify (Traefik) maneja los puertos 80/443 y el HTTPS, así que
# este archivo no incluye caddy. Tampoco incluye minio: las imágenes van al
# MinIO compartido de la VPS, un recurso de Coolify aparte
# (deploy/shared-storage/, ver docs/despliegue.md sección 4.3).
# Tampoco incluye postgres: la base es un recurso PostgreSQL de Coolify aparte,
# con sus propios respaldos, que un despliegue de la aplicación no reinicia.
# Para un VPS sin Coolify usar docker-compose.prod.yml.
#
# Imágenes: GitHub Actions construye migrate, api y web y las publica en GHCR
# (ghcr.io/rade-studio/vipe-pos-<servicio>) con el SHA completo del commit; el
# job de despliegue mueve la etiqueta de la rama (dev o main) a esas imágenes
# cuando todas las comprobaciones pasaron. En el servidor no se ejecuta ningún
# docker build: Coolify solo descarga las imágenes (pull_policy: always).
#   - El servidor inicia sesión en ghcr.io una sola vez, como root, con un
#     token con permiso read:packages (ver docs/despliegue.md, sección 3.1).
#   - VIPE_IMAGE_TAG se define en cada recurso: dev en staging, main en
#     producción.
#   - Volver atrás: poner VIPE_IMAGE_TAG en el SHA completo de un commit
#     anterior y volver a desplegar; para seguir la rama de nuevo, restaurar
#     dev o main.
#
# Base de datos (una vez por ambiente, antes del primer despliegue):
#   0a. En el mismo proyecto y ambiente, crear un recurso PostgreSQL 16. Su UUID
#       es el nombre del contenedor en la red `coolify` y va en DATABASE_HOST.
#   0b. En el servidor, crear vipe_migrator y vipe_api con las mismas
#       contraseñas que se cargan en el paso 4:
#         VIPE_MIGRATOR_PASSWORD=... VIPE_API_PASSWORD=... \
#           bash deploy/postgres/create-roles.sh --container <uuid de la base>
#   0c. En la pestaña Backups del recurso, programar un respaldo diario al
#       almacenamiento S3 del servidor.
#
# Configuración del recurso en Coolify (Docker Compose):
#   1. Build Pack: Docker Compose. Docker Compose Location: /docker-compose.coolify.yml
#   2. Domains por servicio (reemplazar <sitio> por el dominio del POS):
#        api -> https://<sitio>:4000/api,https://<sitio>:4000/socket.io
#        web -> https://<sitio>:3000
#      El puerto después del dominio indica a Coolify el puerto interno del
#      contenedor; el público sigue siendo 443.
#   3. Strip prefixes: DESACTIVADO en api (la API espera /api y /socket.io/
#      completos).
#   4. Environment: cargar las variables marcadas como obligatorias (${VAR:?}).
#      DATABASE_HOST es el UUID del recurso PostgreSQL (paso 0a).
#      VIPE_IMAGE_TAG es dev en staging y main en producción.
#      WEB_ORIGIN es https://<sitio>. El grupo S3_* sale del MinIO compartido:
#        bash deploy/shared-storage/provision-app.sh vipe-pos-<ambiente> vipe-pos-<ambiente>
#      (<ambiente> = staging o production) y pegar aquí el bloque impreso.
#   5. En el recurso del MinIO compartido, agregar https://<sitio> a
#      MINIO_CORS_ORIGINS y volver a desplegarlo.
#   6. Activar "Connect to Predefined Network" en el recurso, para que migrate
#      y api lleguen a la base por la red `coolify`.
#
# Comprobaciones después del primer despliegue:
#   a. curl -s https://<sitio>/api/health
#      -> {"status":"ok","service":"vipe-pos-api"}: el prefijo /api llega a la API.
#   b. curl -s "https://<sitio>/socket.io/?EIO=4&transport=polling"
#      -> 0{"sid":...,"upgrades":["websocket"],...}: la barra final se mantiene
#      (sin ella la API responde 404 "Cannot GET /socket.io").
#   c. Iniciar sesión en el navegador y revisar en la pestaña Red que la
#      conexión wss://<sitio>/socket.io/?EIO=4&transport=websocket queda en 101
#      (actualización a WebSocket); las pantallas reciben cambios en vivo.
#
# `exclude_from_hc` is a Coolify key that plain `docker compose` rejects
# ("additional properties not allowed"); to validate locally, drop that line
# and pass a file with the required variables (test values are enough):
#   printf '%s\n' VIPE_IMAGE_TAG=dev DATABASE_HOST=x VIPE_MIGRATOR_PASSWORD=x VIPE_API_PASSWORD=x \
#     JWT_SECRET=validation-only-secret-of-32-chars WEB_ORIGIN=https://pos.example.com \
#     S3_ENDPOINT=https://s3.example.com S3_REGION=us-east-1 S3_BUCKET=vipe-pos-staging S3_ACCESS_KEY_ID=x \
#     S3_SECRET_ACCESS_KEY=x S3_PUBLIC_BASE_URL=https://s3.example.com/vipe-pos-staging S3_FORCE_PATH_STYLE=true > /tmp/coolify-check.env
#   sed '/exclude_from_hc/d' docker-compose.coolify.yml | docker compose -f - --env-file /tmp/coolify-check.env config --quiet
# ============================================

services:
  # One-shot: applies packages/db/migrations as vipe_migrator and exits.
  migrate:
    image: ghcr.io/rade-studio/vipe-pos-migrate:${VIPE_IMAGE_TAG:?}
    pull_policy: always
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgres://vipe_migrator:${VIPE_MIGRATOR_PASSWORD:?}@${DATABASE_HOST:?}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-vipe_pos}

  api:
    image: ghcr.io/rade-studio/vipe-pos-api:${VIPE_IMAGE_TAG:?}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgres://vipe_api:${VIPE_API_PASSWORD:?}@${DATABASE_HOST:?}:${DATABASE_PORT:-5432}/${POSTGRES_DB:-vipe_pos}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      JWT_SECRET: ${JWT_SECRET:?}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # One reverse proxy, Traefik (Coolify), in front of the API: trust its X-Forwarded-For
      # entry so per-client limits see the real address (2 only if a trusted CDN hop is added).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      # Shared VPS MinIO (deploy/shared-storage/provision-app.sh prints this block).
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: ${S3_REGION:?}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ghcr.io/rade-studio/vipe-pos-web:${VIPE_IMAGE_TAG:?}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
